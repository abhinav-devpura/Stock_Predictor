name: Refresh picks

# Monthly refresh of BOTH signals, then commit so GitHub Pages redeploys:
#   - prices (--refresh): updates market cap / book-to-market and the as-of date
#   - EDGAR (--refresh-edgar): INCREMENTAL — fetches only 10-K/10-Q + fundamentals
#     filed since the committed cache (most months that's little or nothing), so
#     it stays fast instead of re-pulling thousands of documents.
# The updated EDGAR feature caches are committed back, so each run builds on the
# last. Runs on the 1st of each month, or on demand from the Actions tab.

on:
  schedule:
    - cron: "0 6 1 * *"        # 1st of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-picks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45         # incremental EDGAR + prices; ample headroom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild snapshot + pages (prices + incremental EDGAR)
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          python scripts/build_picks.py --refresh --refresh-edgar
          python scripts/build_dashboard.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/picks.json frontend/dashboard.html frontend/process.html docs/ \
                  data_cache/fundamentals_*.parquet data_cache/filingtext_v2_*.parquet
          if git diff --cached --quiet; then
            echo "No change in picks — nothing to commit."
          else
            git commit -m "chore: auto-refresh picks ($(date -u +%Y-%m-%d))"
            git push
          fi
